; Dev-only PHP overrides for the KOReader Companion dev stack.
;
; Mounted at /usr/local/etc/php/conf.d/zz-dev.ini. conf.d is loaded in
; alphabetical order, so "zz-" wins over the image's nextcloud.ini,
; opcache-recommended.ini and docker-php-ext-*.ini.
;
; NEVER ship this to production.

; --- live reload -----------------------------------------------------------
; The image enables opcache with a 2s revalidate window. Zero it so a saved
; file is picked up on the very next request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.revalidate_path = 1

; JIT makes stack traces harder to read and buys nothing here.
opcache.jit = disable
opcache.jit_buffer_size = 0

; --- uploads ---------------------------------------------------------------
; PHP_UPLOAD_LIMIT/PHP_MEMORY_LIMIT in compose.yaml cover most of this;
; repeated here so post_max_size is explicit and the file stands alone.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; --- make crashes visible instead of a white page --------------------------
; This matters right now: several call sites in this app fatal on NC 34, and a
; blank 500 tells you nothing. errorlog routes to the Apache error log, so the
; trace shows up in `make logs`.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
zend.assertions = 1
