name: CI

# The repo previously had no CI on push or pull request at all -- release.yml only
# fired on a published release, and pinned PHP 8.1, which NC 33+ no longer supports.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in composer.json, through the version the NC 34
        # container actually runs.
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, iconv, zlib
          coverage: none

      # -w makes deprecations fail the job, which is the point: an implicitly
      # nullable parameter slipped through until PHP 8.4 started warning.
      - name: Lint
        run: find lib templates -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate composer.json against the lock file
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

  static-analysis:
    name: Psalm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-progress --prefer-dist

      # Baselined rather than clean: the existing findings are mostly missing
      # types, and failing the build on them would just mean nobody adds the check.
      # What matters is that the baseline cannot grow -- a new error fails here.
      - name: Psalm
        run: ./vendor/bin/psalm --no-progress --output-format=github

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # These parse untrusted files in-process: smalot/pdfparser reads uploaded
      # PDFs, kiwilan/php-archive shells out to unrar, and epubjs unpacks EPUBs in
      # the browser. Nothing was watching their advisories.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # --locked: this job never runs composer install, and without vendor/
      # an install-less audit refuses to run at all ("No installed packages
      # found"). Auditing the committed lock is also the stronger statement
      # for CI -- it checks exactly what a release would ship.
      - name: composer audit
        run: composer audit --no-dev --locked

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # High and above only: epubjs is effectively unmaintained and its transitive
      # dev tree is noisy, so a low-severity advisory must not wedge every PR.
      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

  info-xml:
    name: info.xml schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate against the published app store schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils
          curl -sSfo /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches NC 34's own engines field.
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # Translation files are generated from the t()/n() calls in the sources, so
      # a new string without a refresh means it ships untranslated in every
      # language.
      - name: Check l10n is in sync with the sources
        run: node dev/l10n-extract.mjs --check

      # The bundles are committed because the app store tarball has no build
      # step. If a source change lands without a rebuild, the shipped JS is
      # stale -- so fail loudly rather than shipping a mismatch.
      - name: Check the committed bundle is current
        run: |
          rm -f js/*.map css/*.map
          if ! git diff --quiet -- js css; then
            echo "::error::js/ and css/ are out of date. Run 'npm run build' and commit the result."
            git diff --stat -- js css
            exit 1
          fi

  integration:
    name: OPDS + KOReader against Nextcloud 34
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cron has no healthcheck by design (see compose.yaml) -- some compose
      # versions fail --wait outright when it is pointed at a service with
      # healthcheck.disable: true (docker/compose#13522), which is what
      # actually failed this step, not a slow boot. Wait on app/db, which do
      # have one, then start cron as a plain dependent service.
      - name: Boot the stack
        run: |
          docker compose up -d --wait --build app db
          docker compose up -d cron
          ./dev/provision.sh

      - name: OPDS suite
        run: ./test_scripts/test_opds.sh --base-url http://localhost:8080

      - name: KOReader sync suite
        run: ./test_scripts/test_koreader.sh --base-url http://localhost:8080 --password test123

      # The boot step has failed deterministically and early (~1 min, three
      # runs, both port layouts), which rules out the installer wait -- but
      # the app-only tail never showed why. Dump the full picture instead:
      # every container's state and every service's log.
      - name: Boot diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          for svc in $(docker compose config --services); do
            echo "=== logs: $svc ==="
            docker compose logs --tail 100 "$svc" || true
          done
