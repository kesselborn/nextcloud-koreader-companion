name: Build and Release

on:
  release:
    types: [published]

env:
  APP_NAME: koreader_companion

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup PHP
        uses: shivammathur/setup-php@ec406be512d7077f68eed36e63f4d91bc006edc4 # v2
        with:
          php-version: '8.3'
          extensions: zip
      
      # make appstore now runs `npm ci && npm run build`, so the tarball ships
      # freshly built assets rather than whatever happened to be committed.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # The tarball is named with the version from appinfo/info.xml (see the
      # Makefile), so the workflow has to read the same value to find and
      # publish it -- a hardcoded koreader_companion.tar.gz has not existed
      # since 1.5.2.
      - name: Read the app version
        run: echo "APP_VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)" >> "$GITHUB_ENV"

      - name: Build app tarball
        run: make appstore

      - name: Upload to GitHub release
        uses: svenstaro/upload-release-action@7027b7670c56b9473901daad1fb8a09ab534688e # v2.9.0
        id: github_release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/artifacts/appstore/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.tar.gz
          asset_name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.tar.gz
          tag: ${{ github.event.release.tag_name }}
          overwrite: true

      # The appstore upload needs credentials only the canonical repo has.
      # On a fork the secrets are empty and the step can never succeed, so
      # detect that once and skip the appstore leg -- the GitHub release
      # asset above is still built and uploaded everywhere.
      - name: Check for appstore credentials
        id: appstore_secrets
        run: |
          if [ -n "${{ secrets.APPSTORE_TOKEN }}" ] && [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No appstore credentials configured -- skipping the appstore upload (expected on forks)."
          fi

      - name: Wait for release asset availability
        if: steps.appstore_secrets.outputs.available == 'true'
        run: |
          echo "Waiting for GitHub to propagate release asset..."
          sleep 30

      - name: Upload app to Nextcloud appstore
        if: steps.appstore_secrets.outputs.available == 'true'
        uses: R0Wi/nextcloud-appstore-push-action@cec25fa221c6b2a82701dca2a9455b39f9f7b252 # latest commit
        with:
          app_name: ${{ env.APP_NAME }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.github_release.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ github.event.release.prerelease }}